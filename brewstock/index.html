<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#1e40af"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>BrewStock — Coffee Shop Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css"/>
</head>
<body>

<!-- ─── LOGIN ─────────────────────────────────────────────── -->
<div id="login-wrap" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <svg width="40" height="40" viewBox="0 0 44 44" fill="none">
        <rect width="44" height="44" rx="12" fill="#1e40af"/>
        <path d="M11 30 Q11 15 22 11 Q33 15 33 30" stroke="#f97316" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <ellipse cx="22" cy="32" rx="8" ry="2.5" fill="#f97316" opacity="0.25"/>
        <circle cx="22" cy="31" r="3" fill="#f97316"/>
      </svg>
    </div>
    <h2>Masuk <span class="sparkle">✨</span></h2>
    <p class="login-sub">Selamat datang kembali di BrewStock. Masukkan kredensial kamu.</p>

    <div id="l-err" class="login-err" style="display:none"></div>

    <div class="field-group">
      <label>Username</label>
      <div class="input-icon-wrap">
        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input id="l-user" type="text" placeholder="Masukkan username" autocomplete="username"/>
      </div>
    </div>
    <div class="field-group">
      <label>Password</label>
      <div class="input-icon-wrap">
        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password"/>
        <button type="button" class="input-eye" onclick="togglePass()">
          <svg id="l-eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button class="btn btn-primary btn-full btn-pill" onclick="App.login()">Masuk</button>

    <div class="demo-row">
      <p>Demo credentials</p>
      <span class="demo-chip" onclick="fillDemo('admin')">admin / admin123</span>
      <span class="demo-chip" onclick="fillDemo('user')">bartender / user123</span>
    </div>

    <p class="login-foot">BrewStock — Coffee Shop Operational Control</p>
  </div>
</div>

<!-- ─── APP SHELL ──────────────────────────────────────────── -->
<div id="app" class="app-shell" style="display:none">

  <!-- Main -->
  <div class="main-wrap">
    <header id="topbar" class="topbar">
      <div class="topbar-left">
        <button id="back-btn" class="back-btn" onclick="App.goHome()" style="display:none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span id="page-ttl" class="page-ttl">BrewStock</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-user" onclick="App.logout()" title="Logout">
          <div class="topbar-avatar" id="topbar-avatar">A</div>
          <span class="topbar-uname" id="topbar-uname">Admin</span>
        </div>
      </div>
    </header>

    <main id="page-content" class="page"></main>

    <nav id="bottom-tabs" class="bottom-tabs"></nav>
  </div>
</div>

<!-- ─── MODAL ─────────────────────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay" onclick="Modal.close()">
  <div id="modal-box" class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3 id="modal-title">Modal</h3>
      <button class="modal-close" onclick="Modal.close()">×</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-footer" class="modal-foot"></div>
  </div>
</div>

<!-- ─── TOAST ─────────────────────────────────────────────── -->
<div id="toast-wrap"></div>

<!-- ─── SCRIPTS (urutan penting) ─────────────────────────── -->
<script src="js/config.js"></script>
<script src="js/brewstock-bundle.js"></script>

</body>
</html>
