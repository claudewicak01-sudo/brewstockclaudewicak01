<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#1e40af"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>BrewStock — Coffee Shop Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css"/>
</head>
<body>

<!-- ─── LOGIN ─────────────────────────────────────────────── -->
<div id="login-wrap" class="login-wrap">
  <div class="login-brand">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
      <rect width="44" height="44" rx="12" fill="#1e40af"/>
      <path d="M11 30 Q11 15 22 11 Q33 15 33 30" stroke="#f97316" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <ellipse cx="22" cy="32" rx="8" ry="2.5" fill="#f97316" opacity="0.25"/>
      <circle cx="22" cy="31" r="3" fill="#f97316"/>
    </svg>
    <div>
      <h1>BrewStock</h1>
      <p>Coffee Shop Operational Control</p>
    </div>
  </div>

  <div class="login-card">
    <h2>Masuk ke sistem</h2>
    <p class="login-sub">Masukkan kredensial akun Anda</p>

    <div id="l-err" class="login-err" style="display:none"></div>

    <div class="form-group">
      <label>Username</label>
      <input id="l-user" type="text" placeholder="username" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn btn-primary btn-full" onclick="App.login()">Masuk</button>

    <div class="demo-row">
      <p>Demo credentials:</p>
      <span class="demo-chip" onclick="fillDemo('admin')">admin / admin123</span>
      <span class="demo-chip" onclick="fillDemo('user')">bartender / user123</span>
    </div>
  </div>
</div>

<!-- ─── APP SHELL ──────────────────────────────────────────── -->
<div id="app" class="app-shell" style="display:none">

  <!-- Backdrop (mobile) -->
  <div id="sidebar-bd" onclick="App.closeSidebar()"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <a class="sidebar-logo" href="#">
        <svg width="28" height="28" viewBox="0 0 44 44" fill="none">
          <rect width="44" height="44" rx="12" fill="rgba(255,255,255,0.15)"/>
          <path d="M11 30 Q11 15 22 11 Q33 15 33 30" stroke="#f97316" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <circle cx="22" cy="31" r="3" fill="#f97316"/>
        </svg>
        <span>BrewStock</span>
      </a>
      <button class="sidebar-close" onclick="App.closeSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <nav id="sidebar-nav" class="sidebar-nav"></nav>

    <div class="sidebar-foot">
      <div class="sidebar-avatar" id="sidebar-avatar">A</div>
      <div>
        <div class="sidebar-uname" id="sidebar-uname">Admin</div>
        <div class="sidebar-urole" id="sidebar-urole">Admin/Owner</div>
      </div>
      <button onclick="App.logout()" title="Logout" style="margin-left:auto;background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-wrap">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" onclick="App.toggleSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span id="page-ttl" class="page-ttl">Dashboard</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-user" onclick="App.logout()" title="Logout">
          <div class="topbar-avatar" id="topbar-avatar">A</div>
          <span class="topbar-uname" id="topbar-uname">Admin</span>
        </div>
      </div>
    </header>

    <main id="page-content" class="page"></main>
  </div>

  <!-- Mobile Bottom Nav -->
  <nav id="mobile-nav" class="mobile-nav"></nav>
</div>

<!-- ─── MODAL ─────────────────────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay" onclick="Modal.close()">
  <div id="modal-box" class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3 id="modal-title">Modal</h3>
      <button class="modal-close" onclick="Modal.close()">×</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-footer" class="modal-foot"></div>
  </div>
</div>

<!-- ─── TOAST ─────────────────────────────────────────────── -->
<div id="toast-wrap"></div>

<!-- ─── SCRIPTS (urutan penting) ─────────────────────────── -->
<script src="js/brewstock-bundle.js"></script>

</body>
</html>
