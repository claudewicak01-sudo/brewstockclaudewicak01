<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrewStock — Coffee Shop Control System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-brand">
      <div class="brand-mark">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="#1B4FD8"/>
          <path d="M10 28 Q10 14 20 10 Q30 14 30 28" stroke="#F97316" stroke-width="3" stroke-linecap="round" fill="none"/>
          <ellipse cx="20" cy="30" rx="8" ry="3" fill="#F97316" opacity="0.3"/>
          <circle cx="20" cy="29" r="2.5" fill="#F97316"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>BrewStock</h1>
        <p>Coffee Shop Operational Control</p>
      </div>
    </div>
    <div class="login-card">
      <h2>Masuk ke sistem</h2>
      <p class="login-sub">Masukkan kredensial akun Anda</p>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div id="login-error" class="login-error" style="display:none"></div>
      <button class="btn-primary btn-full" onclick="App.login()">Masuk</button>
      <div class="login-demo">
        <p>Demo credentials:</p>
        <span onclick="fillDemo('admin')" class="demo-badge">admin / admin123</span>
        <span onclick="fillDemo('user')" class="demo-badge">bartender / user123</span>
      </div>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app-shell" class="app-shell" style="display:none">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
            <rect width="40" height="40" rx="10" fill="#1B4FD8"/>
            <path d="M10 28 Q10 14 20 10 Q30 14 30 28" stroke="#F97316" stroke-width="3" stroke-linecap="round" fill="none"/>
            <circle cx="20" cy="29" r="2.5" fill="#F97316"/>
          </svg>
          <span>BrewStock</span>
        </div>
        <button class="sidebar-toggle" onclick="App.toggleSidebar()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-user" id="sidebar-user"></div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="App.toggleSidebar()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div id="page-title" class="page-title">Dashboard</div>
        </div>
        <div class="topbar-right">
          <div class="notif-btn" title="Notifikasi">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-dot"></span>
          </div>
          <div class="topbar-user" onclick="App.logout()">
            <div class="user-avatar" id="topbar-avatar">A</div>
            <span id="topbar-name">Admin</span>
          </div>
        </div>
      </header>
      <main id="page-content" class="page-content"></main>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modal-overlay" class="modal-overlay" onclick="Modal.close()" style="display:none">
    <div id="modal-box" class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" onclick="Modal.close()">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/master-bahan.js"></script>
  <script src="js/pages/master-menu.js"></script>
  <script src="js/pages/resep.js"></script>
  <script src="js/pages/approval.js"></script>
  <script src="js/pages/pembelian.js"></script>
  <script src="js/pages/penjualan.js"></script>
  <script src="js/pages/stock.js"></script>
  <script src="js/pages/stock-opname.js"></script>
  <script src="js/pages/daily-report.js"></script>
  <script src="js/pages/audit-center.js"></script>
  <script src="js/pages/audit-trail.js"></script>
  <script src="js/pages/user-management.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
