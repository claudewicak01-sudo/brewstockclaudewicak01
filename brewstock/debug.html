<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>BrewStock — Debug Koneksi</title>
  <style>
    body { font-family: monospace; padding: 24px; background: #111; color: #0f0; font-size: 13px; }
    h2 { color: #fff; }
    .box { background: #1a1a1a; border: 1px solid #333; padding: 16px; border-radius: 8px; margin: 12px 0; }
    .ok  { color: #22c55e; }
    .err { color: #ef4444; }
    .warn{ color: #f97316; }
    input { background: #222; border: 1px solid #444; color: #fff; padding: 8px 12px; border-radius: 4px; width: 300px; font-family: monospace; }
    button { background: #1d4ed8; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-family: monospace; }
    pre { white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h2>🔧 BrewStock — Debug Koneksi Supabase</h2>

  <div class="box">
    <div id="step1">⏳ Step 1: Membaca config.js...</div>
  </div>
  <div class="box">
    <div id="step2">⏳ Step 2: Menunggu...</div>
  </div>
  <div class="box">
    <div id="step3">⏳ Step 3: Menunggu...</div>
  </div>
  <div class="box">
    <div id="step4">⏳ Step 4: Menunggu...</div>
  </div>

  <div class="box" id="manual-test" style="display:none">
    <h3 style="color:#fff;margin:0 0 12px">Test Login Manual</h3>
    <input id="t-user" placeholder="username" value="admin" /><br><br>
    <input id="t-pass" placeholder="password" type="password" value="admin123" /><br><br>
    <button onclick="testLogin()">Test Login</button>
    <pre id="login-result" style="margin-top:12px"></pre>
  </div>

  <script src="js/config.js"></script>
  <script>
    const log = (id, msg, type='') => {
      document.getElementById(id).innerHTML = `<span class="${type}">${msg}</span>`;
    };

    // Step 1: Check config
    (function checkConfig() {
      try {
        const url = typeof SUPABASE_URL !== 'undefined' ? SUPABASE_URL : 'UNDEFINED';
        const key = typeof SUPABASE_KEY !== 'undefined' ? SUPABASE_KEY : 'UNDEFINED';
        const isDemo = !url || url === 'YOUR_PROJECT' || !url.startsWith('https://');

        log('step1',
          `✅ Step 1: config.js terbaca<br>` +
          `URL = <b>${url}</b><br>` +
          `KEY = ${key.substring(0,20)}...<br>` +
          `Mode = <b>${isDemo ? '⚠️ DEMO MODE (URL belum diset)' : '🌐 SUPABASE MODE'}</b>`,
          isDemo ? 'warn' : 'ok'
        );
      } catch(e) {
        log('step1', '❌ Step 1 GAGAL: ' + e.message, 'err');
      }
    })();

    // Step 2: Load Supabase SDK
    async function loadSDK() {
      try {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
          s.onload = res;
          s.onerror = () => rej(new Error('Gagal load Supabase SDK dari CDN'));
          document.head.appendChild(s);
        });
        log('step2', '✅ Step 2: Supabase SDK berhasil dimuat', 'ok');
        return true;
      } catch(e) {
        log('step2', '❌ Step 2 GAGAL: ' + e.message, 'err');
        return false;
      }
    }

    // Step 3: Create client & ping
    async function pingSupabase() {
      try {
        const url = SUPABASE_URL;
        const key = SUPABASE_KEY;
        if (!url.startsWith('https://')) {
          log('step3', '⚠️ Step 3: Skip — URL bukan Supabase asli', 'warn');
          return null;
        }
        const client = window.supabase.createClient(url, key);
        log('step3', '✅ Step 3: Supabase client dibuat', 'ok');
        return client;
      } catch(e) {
        log('step3', '❌ Step 3 GAGAL: ' + e.message, 'err');
        return null;
      }
    }

    // Step 4: Query tabel users
    async function queryUsers(client) {
      try {
        if (!client) {
          log('step4', '⚠️ Step 4: Skip — tidak ada client', 'warn');
          return;
        }
        const { data, error, status, statusText } = await client
          .from('users')
          .select('id, username, role, status')
          .limit(5);

        if (error) {
          log('step4',
            `❌ Step 4 GAGAL query tabel users:<br>` +
            `message: <b>${error.message}</b><br>` +
            `code: ${error.code}<br>` +
            `hint: ${error.hint || '-'}<br>` +
            `HTTP status: ${status} ${statusText}<br><br>` +
            `<b>Kemungkinan penyebab:</b><br>` +
            `• RLS masih aktif → jalankan SQL: ALTER TABLE users DISABLE ROW LEVEL SECURITY;<br>` +
            `• Tabel users belum ada → jalankan supabase-schema.sql<br>` +
            `• anon key salah → cek Settings > API di Supabase`,
            'err'
          );
        } else {
          log('step4',
            `✅ Step 4: Query berhasil! Ditemukan ${data.length} user:<br>` +
            data.map(u => `  • ${u.username} (${u.role}) — ${u.status}`).join('<br>'),
            'ok'
          );
          document.getElementById('manual-test').style.display = 'block';
        }
      } catch(e) {
        log('step4', '❌ Step 4 Exception: ' + e.message, 'err');
      }
    }

    async function testLogin() {
      const user = document.getElementById('t-user').value;
      const pass = document.getElementById('t-pass').value;
      const res = document.getElementById('login-result');
      res.textContent = 'Testing...';
      try {
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data, error } = await client
          .from('users')
          .select('*')
          .ilike('username', user)
          .eq('password', pass)
          .maybeSingle();
        res.textContent = JSON.stringify({ data, error }, null, 2);
        res.className = data ? 'ok' : 'err';
      } catch(e) {
        res.textContent = 'Exception: ' + e.message;
        res.className = 'err';
      }
    }

    // Run all steps
    (async () => {
      const sdkOk = await loadSDK();
      if (!sdkOk) return;
      const client = await pingSupabase();
      await queryUsers(client);
    })();
  </script>
</body>
</html>
